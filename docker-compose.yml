services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    env_file: .env.local
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_PORT}:9000"
    volumes:
      - ./volume:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host clickhouse --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DATABASE\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    depends_on:
      clickhouse:
        condition: service_healthy
